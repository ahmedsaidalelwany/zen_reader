    name: zen_reader
    description: "A modern cross-platform document and ebook reader."
    publish_to: "none"

    version: 1.0.0+1

    environment:
        sdk: ^3.13.1

    dependencies:
        flutter:
            sdk: flutter

        # ─────────────────────────────────────────────
        # UI / Core
        # ─────────────────────────────────────────────

        cupertino_icons: ^1.0.9
        google_fonts: ^8.2.1
        flutter_screenutil: ^5.9.3
        adaptive_platform_ui: ^0.1.111

        # ─────────────────────────────────────────────
        # Responsive / Adaptive UI
        # ─────────────────────────────────────────────

        responsive_framework: ^1.5.1

        # ─────────────────────────────────────────────
        # Animations / Motion
        # ─────────────────────────────────────────────

        flutter_animate: ^4.5.2
        animations: ^3.0.0
        rive: ^0.14.11

        # ─────────────────────────────────────────────
        # Loading / Skeleton UI
        # ─────────────────────────────────────────────

        skeletonizer: ^2.1.3

        # ─────────────────────────────────────────────
        # State Management
        # ─────────────────────────────────────────────

        bloc: ^9.2.1
        flutter_bloc: ^9.1.1

        # ─────────────────────────────────────────────
        # Dependency Injection
        # ─────────────────────────────────────────────

        injectable: ^3.0.0

        # ─────────────────────────────────────────────
        # Navigation
        # ─────────────────────────────────────────────

        go_router: ^18.0.0

        # ─────────────────────────────────────────────
        # Localization / Internationalization
        # ─────────────────────────────────────────────

        localization: ^2.1.1
        intl: ^0.20.3

        # ─────────────────────────────────────────────
        # IDs
        # ─────────────────────────────────────────────

        uuid: ^4.6.0

        # ─────────────────────────────────────────────
        # File System / File Import
        # ─────────────────────────────────────────────

        file_picker: ^12.1.2
        mime: ^2.0.0
        path_provider: ^2.1.6
        open_filex: ^4.7.0

        # ─────────────────────────────────────────────
        # PDF Engine
        # ─────────────────────────────────────────────

        syncfusion_flutter_pdfviewer: ^34.2.5
        syncfusion_flutter_pdf: ^34.2.5

        # ─────────────────────────────────────────────
        # Universal Document Engine
        #
        # PDF
        # DOC / DOCX
        # XLS / XLSX
        # PPT / PPTX
        # EPUB
        # CBZ
        # TXT
        # CSV
        # RTF
        # ODT / ODS / ODP
        # ─────────────────────────────────────────────

        universal_dockit: ^1.0.1

        # ─────────────────────────────────────────────
        # HTML / XHTML
        # ─────────────────────────────────────────────

        flutter_html: ^3.0.0

        # ─────────────────────────────────────────────
        # Google Drive
        # The only online integration
        # ─────────────────────────────────────────────

        google_sign_in: ^7.2.0
        googleapis: ^17.0.0
        googleapis_auth: ^2.3.3
        extension_google_sign_in_as_googleapis_auth: ^3.0.0

    dev_dependencies:
        # ─────────────────────────────────────────────
        # Flutter Testing
        # ─────────────────────────────────────────────

        flutter_test:
            sdk: flutter

        # ─────────────────────────────────────────────
        # Static Analysis / Linting
        # ─────────────────────────────────────────────

        flutter_lints: ^6.0.0

        # ─────────────────────────────────────────────
        # Code Generation
        # ─────────────────────────────────────────────

        build_runner: ^2.16.0
        injectable_generator: ^3.1.3

        # ─────────────────────────────────────────────
        # Testing Utilities
        # ─────────────────────────────────────────────

        mocktail: ^1.0.5
        bloc_test: ^10.0.0

    flutter:
        uses-material-design: true
